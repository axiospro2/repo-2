repos:
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        files: ^(app|tests)/
        args: ["--config", "app/pyproject.toml"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      - id: ruff
        files: ^(app|tests)/
        args: ["--config", "app/pyproject.toml", "--fix"]

