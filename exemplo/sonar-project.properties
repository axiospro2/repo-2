# Configuração do SonarQube para o BFF de Faturamento.
#
# AJUSTAR: projectKey/projectName devem bater com o projeto já cadastrado
# no Sonar de prod (não invente um novo - use o key existente).
sonar.projectKey=CHANGE_ME
sonar.projectName=Faturamento IRB - BFF

# Caminhos relativos a este arquivo (dentro de app/, onde já ficam
# pyproject.toml/requirements*.txt/venv - o pipeline deve rodar pytest e o
# sonar-scanner com o diretório de trabalho aqui, senão os caminhos do
# coverage.xml não batem com sonar.sources e a cobertura aparece zerada).
sonar.sources=src
sonar.tests=tests
sonar.exclusions=**/__pycache__/**,**/*.egg-info/**,venv/**
sonar.test.exclusions=**/__pycache__/**

sonar.sourceEncoding=UTF-8

# Relatório de cobertura (Cobertura XML, gerado pelo pytest-cov - ver comando
# no README/pipeline). ESSA LINHA é o que estava faltando: sem ela, o Sonar
# nunca sabe onde procurar o coverage.xml e mostra 0%/sem dados, mesmo com o
# pytest local em 100%.
sonar.python.coverage.reportPaths=coverage.xml

# Opcional, mas recomendado: resultado dos testes (pass/fail) via JUnit XML.
sonar.python.xunit.reportPath=junit.xml
